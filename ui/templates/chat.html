<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Delivery Brain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background: #1a1a2e;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: #aaa;
            display: block;
        }
        .nav-item:hover, .nav-item.active { background: rgba(102,126,234,0.2); color: #fff; }
        .user-info {
            margin-top: auto;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .user-role { font-size: 12px; color: #888; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 250px);
        }
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }
        .message {
            max-width: 80%;
            margin-bottom: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.5;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }
        .message pre {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 10px;
        }
        .input-area {
            padding: 20px 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 16px;
        }
        .input-area input {
            flex: 1;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }
        .input-area button {
            padding: 16px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .examples {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .examples h3 { font-size: 14px; color: #888; margin-bottom: 12px; }
        .example-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chip:hover { background: rgba(102,126,234,0.3); }
        .typing { opacity: 0.7; font-style: italic; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Delivery Brain</div>
        <a href="/dashboard" class="nav-item">Dashboard</a>
        <a href="/chat" class="nav-item active">Chat</a>
        <a href="/graph" class="nav-item">Knowledge Graph</a>
        <a href="/simulation" class="nav-item">Simulation</a>
        <div class="user-info">
            <div id="userName">User</div>
            <div class="user-role" id="userRole">Role</div>
            <a href="/login" style="color:#667eea;font-size:12px;margin-top:8px;display:block;">Logout</a>
        </div>
    </div>
    <div class="main">
        <div class="header">
            <h2>Project Assistant</h2>
            <span id="currentDate"></span>
        </div>
        <div class="examples">
            <h3>Try asking:</h3>
            <div class="example-chips">
                <div class="chip" onclick="askQuestion(this.textContent)">What is the current project status?</div>
                <div class="chip" onclick="askQuestion(this.textContent)">Who left the project?</div>
                <div class="chip" onclick="askQuestion(this.textContent)">What are the main risks?</div>
                <div class="chip" onclick="askQuestion(this.textContent)">How is Stream 2 doing?</div>
            </div>
        </div>
        <div class="chat-container" id="chatContainer"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ask about the project..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const sessionId = localStorage.getItem('session_id');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!sessionId) window.location.href = '/login';

        document.getElementById('userName').textContent = user.username || 'User';
        document.getElementById('userRole').textContent = user.role?.name || 'Unknown';
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        function askQuestion(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        function addMessage(content, isUser) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'assistant'}`;
            div.innerHTML = content.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, true);
            input.value = '';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant typing';
            typingDiv.textContent = 'Thinking...';
            document.getElementById('chatContainer').appendChild(typingDiv);

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message, session_id: sessionId})
                });
                typingDiv.remove();

                if (response.ok) {
                    const data = await response.json();
                    console.log('Chat response:', data);
                    const answer = data.answer || 'No response generated.';
                    addMessage(answer, false);

                    // Show follow-up questions if available
                    if (data.follow_up_questions && data.follow_up_questions.length > 0) {
                        const followUps = data.follow_up_questions.slice(0, 2).map(q => `- ${q}`).join('\n');
                        addMessage(`**You might also ask:**\n${followUps}`, false);
                    }
                } else {
                    const errData = await response.json().catch(() => ({}));
                    console.error('Chat error:', errData);
                    addMessage(`Error: ${errData.detail || 'Unknown error'}`, false);
                }
            } catch (err) {
                typingDiv.remove();
                console.error('Connection error:', err);
                addMessage('Connection error. Please try again.', false);
            }
        }
    </script>
</body>
</html>
