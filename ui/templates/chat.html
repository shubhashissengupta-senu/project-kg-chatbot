<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Delivery Brain</title>
    <!-- Vega-Lite for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            height: 100vh;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background: #1a1a2e;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .nav-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: #aaa;
            display: block;
        }
        .nav-item:hover, .nav-item.active { background: rgba(102,126,234,0.2); color: #fff; }
        .user-info {
            margin-top: auto;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }
        .user-details { flex: 1; }
        .user-name { font-weight: 600; margin-bottom: 2px; }
        .user-role { font-size: 12px; color: #888; }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: calc(100% - 250px);
        }
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message {
            max-width: 80%;
            margin-bottom: 20px;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .message-header {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }
        .message pre {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 10px;
        }
        .input-area {
            padding: 20px 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.02);
        }
        .input-container {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 8px 8px 8px 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-container:focus-within {
            border-color: rgba(102,126,234,0.5);
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .input-area input {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .input-area button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        .examples {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .examples h3 { font-size: 14px; color: #888; margin-bottom: 12px; }
        .example-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chip:hover { background: rgba(102,126,234,0.3); }
        .typing { opacity: 0.7; font-style: italic; }
        .chart-container {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        .chart-container .vega-embed {
            width: 100%;
        }
        .chart-container .vega-embed .vega-actions {
            display: none;
        }
        .data-table {
            margin-top: 12px;
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table th, .data-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .data-table th {
            background: rgba(102,126,234,0.2);
            font-weight: 600;
            color: #a8b4ff;
        }
        .data-table tr:hover {
            background: rgba(255,255,255,0.05);
        }
        .follow-up {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .follow-up-label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .follow-up-btn {
            display: inline-block;
            padding: 6px 14px;
            margin: 4px 4px 4px 0;
            background: rgba(102,126,234,0.2);
            border: 1px solid rgba(102,126,234,0.3);
            border-radius: 16px;
            font-size: 12px;
            color: #a8b4ff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .follow-up-btn:hover {
            background: rgba(102,126,234,0.3);
            border-color: rgba(102,126,234,0.5);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Delivery Brain</div>
        <a href="/dashboard" class="nav-item">Dashboard</a>
        <a href="/chat" class="nav-item active">Chat</a>
        <a href="/graph" class="nav-item">Knowledge Graph</a>
        <a href="/simulation" class="nav-item">Simulation</a>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">U</div>
            <div class="user-details">
                <div class="user-name" id="userName">User</div>
                <div class="user-role" id="userRole">Role</div>
                <a href="/login" style="color:#667eea;font-size:11px;margin-top:4px;display:block;">Logout</a>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="header">
            <h2>Project Assistant</h2>
            <span id="currentDate"></span>
        </div>
        <div class="examples">
            <h3>Try asking:</h3>
            <div class="example-chips">
                <div class="chip" onclick="askQuestion(this.textContent)">What is the current project status?</div>
                <div class="chip" onclick="askQuestion(this.textContent)">Who left the project?</div>
                <div class="chip" onclick="askQuestion(this.textContent)">What are the main risks?</div>
                <div class="chip" onclick="askQuestion(this.textContent)">How is Stream 2 doing?</div>
            </div>
        </div>
        <div class="chat-container" id="chatContainer"></div>
        <div class="input-area">
            <div class="input-container">
                <input type="text" id="messageInput" placeholder="Ask about the project..." onkeypress="if(event.key==='Enter')sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const sessionId = localStorage.getItem('session_id');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!sessionId) window.location.href = '/login';

        const displayName = user.display_name || user.username || 'User';
        document.getElementById('userName').textContent = displayName;
        document.getElementById('userRole').textContent = user.role_display || user.role?.name || user.role || 'Unknown';
        document.getElementById('userAvatar').textContent = displayName.charAt(0).toUpperCase();
        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        function askQuestion(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }

        function addMessage(content, isUser, followUps = null, visualization = null) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'assistant'}`;

            const header = `<div class="message-header">${isUser ? 'You' : 'Assistant'}</div>`;
            let body = content.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Add chart container if visualization is present
            let chartHtml = '';
            if (visualization) {
                const chartId = 'chart-' + Date.now();
                chartHtml = `<div class="chart-container"><div id="${chartId}"></div></div>`;
            }

            let followUpHtml = '';
            if (followUps && followUps.length > 0) {
                followUpHtml = `<div class="follow-up">
                    <div class="follow-up-label">Suggested:</div>
                    ${followUps.slice(0, 3).map(q => `<span class="follow-up-btn" onclick="askQuestion('${q.replace(/'/g, "\\'")}')">${q}</span>`).join('')}
                </div>`;
            }

            div.innerHTML = header + body + chartHtml + followUpHtml;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            // Render Vega-Lite chart if visualization is present
            if (visualization) {
                const chartId = div.querySelector('.chart-container > div').id;
                renderChart(chartId, visualization);
            }
        }

        async function renderChart(elementId, spec) {
            try {
                await vegaEmbed('#' + elementId, spec, {
                    actions: false,
                    renderer: 'svg',
                    theme: 'dark'
                });
            } catch (error) {
                console.error('Error rendering chart:', error);
                document.getElementById(elementId).innerHTML = '<p style="color:#ff6b6b;font-size:12px;">Chart could not be rendered</p>';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, true);
            input.value = '';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant typing';
            typingDiv.textContent = 'Thinking...';
            document.getElementById('chatContainer').appendChild(typingDiv);

            try {
                const response = await fetch('/api/chat/message', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message, session_id: sessionId})
                });
                typingDiv.remove();

                if (response.ok) {
                    const data = await response.json();
                    console.log('Chat response:', data);
                    const answer = data.answer || 'No response generated.';
                    const followUps = data.follow_up_questions || [];
                    const visualization = data.visualization || null;
                    addMessage(answer, false, followUps, visualization);
                } else {
                    const errData = await response.json().catch(() => ({}));
                    console.error('Chat error:', errData);
                    addMessage(`Error: ${errData.detail || 'Unknown error'}`, false);
                }
            } catch (err) {
                typingDiv.remove();
                console.error('Connection error:', err);
                addMessage('Connection error. Please try again.', false);
            }
        }
    </script>
</body>
</html>
