<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Delivery Brain</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .login-container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            width: 400px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 16px;
        }
        input::placeholder { color: #888; }
        select option { background: #1a1a2e; color: #fff; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        .error {
            background: rgba(255,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .roles-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .roles-info h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #aaa;
        }
        .role-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 13px;
            color: #888;
        }
        .brain-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .brain-svg {
            width: 120px;
            height: 120px;
        }
        .brain-path {
            fill: none;
            stroke: url(#brainGradient);
            stroke-width: 2;
            stroke-linecap: round;
        }
        .brain-node {
            fill: #667eea;
            animation: pulse 2s ease-in-out infinite;
        }
        .brain-node:nth-child(odd) { animation-delay: 0.5s; }
        .brain-node:nth-child(even) { animation-delay: 1s; }
        .brain-connection {
            stroke: rgba(102, 126, 234, 0.4);
            stroke-width: 1;
            animation: signal 3s ease-in-out infinite;
        }
        .brain-connection:nth-child(odd) { animation-delay: 0.3s; }
        .brain-connection:nth-child(even) { animation-delay: 0.7s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes signal {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
        .glow {
            filter: drop-shadow(0 0 8px rgba(102, 126, 234, 0.6));
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brain-container">
            <svg class="brain-svg glow" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#667eea"/>
                        <stop offset="100%" style="stop-color:#764ba2"/>
                    </linearGradient>
                </defs>
                <!-- Neural connections -->
                <g class="connections">
                    <line class="brain-connection" x1="30" y1="25" x2="50" y2="35"/>
                    <line class="brain-connection" x1="70" y1="25" x2="50" y2="35"/>
                    <line class="brain-connection" x1="50" y1="35" x2="35" y2="50"/>
                    <line class="brain-connection" x1="50" y1="35" x2="65" y2="50"/>
                    <line class="brain-connection" x1="35" y1="50" x2="50" y2="65"/>
                    <line class="brain-connection" x1="65" y1="50" x2="50" y2="65"/>
                    <line class="brain-connection" x1="20" y1="45" x2="35" y2="50"/>
                    <line class="brain-connection" x1="80" y1="45" x2="65" y2="50"/>
                    <line class="brain-connection" x1="35" y1="50" x2="25" y2="70"/>
                    <line class="brain-connection" x1="65" y1="50" x2="75" y2="70"/>
                    <line class="brain-connection" x1="50" y1="65" x2="50" y2="80"/>
                    <line class="brain-connection" x1="25" y1="70" x2="50" y2="80"/>
                    <line class="brain-connection" x1="75" y1="70" x2="50" y2="80"/>
                </g>
                <!-- Brain outline -->
                <path class="brain-path" d="M50,15 C30,15 20,30 20,45 C20,55 25,65 30,70 C35,75 40,85 50,85 C60,85 65,75 70,70 C75,65 80,55 80,45 C80,30 70,15 50,15"/>
                <path class="brain-path" d="M50,25 C45,30 45,40 50,45 C55,40 55,30 50,25" style="stroke-width:1.5"/>
                <path class="brain-path" d="M35,35 C30,40 32,50 38,52" style="stroke-width:1.5"/>
                <path class="brain-path" d="M65,35 C70,40 68,50 62,52" style="stroke-width:1.5"/>
                <!-- Neural nodes -->
                <g class="nodes">
                    <circle class="brain-node" cx="30" cy="25" r="3"/>
                    <circle class="brain-node" cx="70" cy="25" r="3"/>
                    <circle class="brain-node" cx="50" cy="35" r="4"/>
                    <circle class="brain-node" cx="20" cy="45" r="3"/>
                    <circle class="brain-node" cx="80" cy="45" r="3"/>
                    <circle class="brain-node" cx="35" cy="50" r="4"/>
                    <circle class="brain-node" cx="65" cy="50" r="4"/>
                    <circle class="brain-node" cx="50" cy="65" r="4"/>
                    <circle class="brain-node" cx="25" cy="70" r="3"/>
                    <circle class="brain-node" cx="75" cy="70" r="3"/>
                    <circle class="brain-node" cx="50" cy="80" r="3"/>
                </g>
            </svg>
        </div>
        <h1>Delivery Brain</h1>
        <p class="subtitle">ABC Inc. S/4HANA Migration</p>

        <div class="error" id="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>

        <div class="roles-info">
            <h3>Demo Accounts</h3>
            <div class="role-item"><span>QA Director</span><span>roshan / demo123</span></div>
            <div class="role-item"><span>Delivery Lead</span><span>krutika / demo123</span></div>
            <div class="role-item"><span>Onsite Lead</span><span>tara / demo123</span></div>
            <div class="role-item"><span>Auditor</span><span>rick / demo123</span></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('session_id', data.session_id);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/chat';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
